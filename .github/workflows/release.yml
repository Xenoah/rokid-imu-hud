name: Publish versioned release

on:
  push:
    branches: [main]
    paths: [release.json]

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify archived source and APK checksums
        run: sha256sum --check SHA256SUMS
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Require Gradle build, IMU regression tests and Android lint
        run: ./gradlew :core:verify :app:assembleDebug :app:lintDebug --no-daemon
      - name: Publish APK, source, screenshots and bilingual notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 tools/publish-release.py
